# Supabase project config (used by the Supabase CLI).
project_id = "canyons-connect"

[functions.oauth-start]
verify_jwt = true

# Hit by the provider's browser redirect — no app JWT is present.
[functions.oauth-callback]
verify_jwt = false

[functions.connect-credentials]
verify_jwt = true

[functions.disconnect-integration]
verify_jwt = true

[functions.sync-now]
verify_jwt = true

# Invoked by cron with a shared CRON_SECRET header, not a user JWT.
[functions.sync-scheduled]
verify_jwt = false

# Invoked by Canvas with a shared secret, not a user JWT.
[functions.canvas-webhook]
verify_jwt = false
